name: Build SSR Plus+ (OpenWrt 24.10, mipsel_24kc)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 24.10.8
  OWRT_TARGET: ramips/mt7621

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-distutils rsync subversion swig \
            time unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OWRT_TARGET}"
          SDK_FILE=$(curl -sL "$BASE/" | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -n1)
          if [ -z "$SDK_FILE" ]; then echo "SDK not found at $BASE"; exit 1; fi
          echo "Downloading $SDK_FILE"
          wget -q "$BASE/$SDK_FILE" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Prepare feeds and sources
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          rm -rf feeds/packages/net/{naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan,v2ray-core,v2ray-geodata,v2ray-plugin,xray-core,xray-plugin}
          ./scripts/feeds install -a
          
          git clone --depth 1 -b dev https://github.com/fw876/helloworld.git package/helloworld
                    # shadowsocks-rust 1.25.0 needs rustc 1.91 but the 24.10 SDK ships 1.90;
                              # roll just this package back to the 1.24.0 snapshot (parent of the 1.25.0 bump)
                                        git -C package/helloworld fetch --depth 1 origin 8663a89265b494e4b995129723c3f070522b80ed
                                                  git -C package/helloworld checkout 8663a89265b494e4b995129723c3f070522b80ed -- shadowsocks-rust
          
          printf '%s\n' \
            "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Client=y" \
            "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Rust_Server=y" \
                   "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Simple_Obfs=y" >> .config
          make defconfig

      - name: Compile luci-app-ssr-plus
        working-directory: openwrt-sdk
        run: |
          if make package/luci-app-ssr-plus/compile -j"$(nproc)"; then
            echo "BUILD OK"
          else
            echo "parallel build failed, retrying single-threaded for logs"
            make package/luci-app-ssr-plus/compile -j1 V=s
          fi
          echo "---- built ipks ----"
          find bin/packages -name '*.ipk' | sort

      - name: Collect ipks
        if: always()
        run: |
          mkdir -p output
          find openwrt-sdk/bin/packages -name '*.ipk' -exec cp -v {} output/ \; || true
          ls -lh output/ || true

      - name: Upload artifacts
        if: always() && hashFiles('output/*.ipk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ssr-plus-mipsel_24kc-openwrt-24.10
          path: output/*.ipk

      - name: Publish release
        if: hashFiles('output/*.ipk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mipsel_24kc-openwrt-24.10
          name: SSR Plus+ for OpenWrt 24.10 (mipsel_24kc)
          body: |
            luci-app-ssr-plus (SSR Plus+) with Shadowsocks-Rust / ShadowsocksR-libev /
                        simple-obfs, built with the official OpenWrt 24.10 SDK
            for mipsel_24kc (ramips/mt7621, e.g. MT7621/MT7620 routers).

            Install on the router:
              opkg update && opkg install luci-app-ssr-plus_*.ipk
          files: output/*.ipk
