name: Publish SSR Plus+ release from build artifacts

# Manual recovery: publish the ipks from an already-finished build run
# without recompiling (e.g. when "Publish release" hit a GitHub rate limit).
# The ipks are packed into a single tarball so publishing needs only a
# handful of API calls.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run ID whose ipk artifact should be published (e.g. 36707203710)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download ipk artifact
        uses: actions/download-artifact@v4
        with:
          name: ssr-plus-mipsel_24kc-openwrt-24.10
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ipks

      - name: Pack SSR Plus+ ipks into one tarball
        run: |
          mkdir -p release
          # Prefer the helloworld feed subdir when the artifact preserved paths;
          # fall back to every ipk otherwise.
          if find ipks -type d -name 'helloworld' | grep -q .; then
            find ipks -type d -name 'helloworld' -exec sh -c 'cp "$1"/*.ipk release/ 2>/dev/null' _ {} \;
          else
            find ipks -name '*.ipk' -exec cp {} release/ \;
          fi
          echo "ipk count: $(ls release/*.ipk | wc -l)"
          tar -czf ssr-plus-mipsel_24kc-openwrt-24.10.tar.gz -C release .
          ls -lh ssr-plus-mipsel_24kc-openwrt-24.10.tar.gz

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mipsel_24kc-openwrt-24.10
          name: SSR Plus+ (OpenWrt 24.10, mipsel_24kc)
          body: |
            luci-app-ssr-plus (SSR Plus+) with Shadowsocks-Rust / ShadowsocksR-libev /
            simple-obfs, built with the official OpenWrt 24.10 SDK.

            Target: ramips/mt7621 (mipsel_24kc), OpenWrt 24.10.

            One-click install on the router:

            ```sh
            wget -qO- https://cdn.jsdelivr.net/gh/d5f6y7/ssr-plus-install/install.sh | sh
            ```
          files: ssr-plus-mipsel_24kc-openwrt-24.10.tar.gz
          fail_on_unmatched_files: true
