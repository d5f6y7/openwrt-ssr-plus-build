name: Build SSR Plus+ (OpenWrt 18.06, mipsel_24kc)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 18.06.9
  OWRT_TARGET: ramips/mt7621

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-dev python3-setuptools python3-distutils rsync subversion swig \
            time unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Download OpenWrt SDK
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OWRT_TARGET}"
          SDK_FILE="openwrt-sdk-18.06.9-ramips-mt7621_gcc-7.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading $SDK_FILE"
          wget -q "$BASE/$SDK_FILE" -O sdk.tar.xz
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk

      - name: Prepare feeds and sources
        working-directory: openwrt-sdk
        run: |
          ./scripts/feeds update -a
          rm -rf feeds/packages/net/{naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan,v2ray-core,v2ray-geodata,v2ray-plugin,xray-core,xray-plugin}
          ./scripts/feeds install -a

          git clone --depth 1 -b dev https://github.com/fw876/helloworld.git package/helloworld

          # OpenWrt 18.06 has no Rust toolchain, so use the C (libev) implementation
          # for Shadowsocks client/server; SSR and simple-obfs are C as well.
          printf '%s\n' \
            "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Libev_Client=y" \
            "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Libev_Server=y" \
            "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Shadowsocks_Simple_Obfs=y" >> .config
          # 18.06 SDK prerequisite check demands Python 2.x and rejects gcc 11+,
          # but our packages are C/Lua only; FORCE=1 is a no-op in 18.06, so
          mkdir -p staging_dir/host && touch staging_dir/host/.prereq-build && make defconfig FORCE=1

      - name: Compile luci-app-ssr-plus
        working-directory: openwrt-sdk
        run: |
          if make package/luci-app-ssr-plus/compile -j"$(nproc)" FORCE=1; then
            echo "BUILD OK"
          else
            echo "parallel build failed, retrying single-threaded for logs"
            make package/luci-app-ssr-plus/compile -j1 V=s FORCE=1
          fi
          echo "---- built ipks ----"
          find bin/packages -name '*.ipk' | sort

      - name: Collect ipks
        if: always()
        run: |
          mkdir -p output
          find openwrt-sdk/bin/packages -name '*.ipk' -exec cp -v {} output/ \; || true
          ls -lh output/ || true

      - name: Pack ipks into one tarball
        if: hashFiles('output/*.ipk') != ''
        run: |
          tar -czf ssr-plus-mipsel_24kc-openwrt-18.06.tar.gz -C output .
          ls -lh ssr-plus-mipsel_24kc-openwrt-18.06.tar.gz

      - name: Upload artifacts
        if: always() && hashFiles('output/*.ipk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ssr-plus-mipsel_24kc-openwrt-18.06
          path: output/*.ipk

      - name: Publish release
        if: hashFiles('ssr-plus-mipsel_24kc-openwrt-18.06.tar.gz') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mipsel_24kc-openwrt-18.06
          name: SSR Plus+ for OpenWrt 18.06 (mipsel_24kc)
          body: |
            luci-app-ssr-plus (SSR Plus+) with Shadowsocks-libev / ShadowsocksR-libev /
            simple-obfs, built with the official OpenWrt 18.06 SDK
            for mipsel_24kc (ramips/mt7621, e.g. MT7621/MT7620 routers).

            Note: OpenWrt 18.06 ships no Rust toolchain, so this build uses the
            C implementation (shadowsocks-libev) for Shadowsocks client/server.
          files: ssr-plus-mipsel_24kc-openwrt-18.06.tar.gz
          fail_on_unmatched_files: true
